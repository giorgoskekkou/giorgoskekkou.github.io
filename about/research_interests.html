<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Research Interests Graph</title>
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="icon" type="image/x-icon" href="../files/favicon.ico" />
<noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
<style>
body {
  margin: 0;
  overflow: hidden;
}

#page-wrapper {
  min-height: 100vh;
}

.research-layout {
  display: flex;
  height: calc(100vh - 4.25rem);
  margin-top: 4.25rem;
}

#graph {
  flex: 3;
  min-width: 0;
  min-height: 0;
  background: #0f172a;
}

#infoPanel {
  flex: 1;
  min-width: 280px;
  background: #111827;
  color: #fff;
  padding: 20px;
  overflow-y: auto;
  border-left: 1px solid #1f2937;
  transition: all 0.3s ease;
}

.fade {
  opacity: 0;
  transform: translateY(10px);
}

.show {
  opacity: 1;
  transform: translateY(0);
}

.node {
  cursor: pointer;
  stroke: #fff;
  stroke-width: 1.5px;
  transition: all 0.2s ease;
}

.node:hover {
  stroke: #38bdf8;
  stroke-width: 3px;
}

.link {
  fill: none;
  stroke: #64748b;
  stroke-opacity: 0.6;
  stroke-width: 1.5px;
}

svg text {
  fill: #fff;
  font-size: 13px;
}

@media (max-width: 980px) {
  .research-layout {
    margin-top: 3.25rem;
    height: calc(100vh - 3.25rem);
  }
}

@media (max-width: 768px) {
  .research-layout {
    flex-direction: column;
  }

  #graph {
    flex: 0 0 60%;
  }

  #infoPanel {
    flex: 0 0 40%;
    min-width: 0;
    border-left: 0;
    border-top: 1px solid #1f2937;
  }
}
</style>
</head>
<body class="is-preload">

<div id="page-wrapper">

  <header id="header">
    <h1><a href="../index.html">Giorgos Kekkou</a></h1>
    <nav>
      <a href="#menu">Menu</a>
    </nav>
  </header>

  <nav id="menu">
    <div class="inner">
      <h2>Menu</h2>
      <ul class="links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="./timeline.html">Timeline</a></li>
        <li><a href="./research_interests.html">Research Interests</a></li>
        <li><a href="./view_projects.html">View All Projects</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
      </ul>
      <a href="#" class="close">Close</a>
    </div>
  </nav>

  <div class="research-layout">
    <svg id="graph"></svg>
    <div id="infoPanel" class="show">
      <h2>Research Topics</h2>
      <p>Click on a node to explore details.</p>
    </div>
  </div>

</div>

<script src="../assets/js/jquery.min.js"></script>
<script src="../assets/js/jquery.scrollex.min.js"></script>
<script src="../assets/js/browser.min.js"></script>
<script src="../assets/js/breakpoints.min.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/main.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const graphElement = document.getElementById('graph');
const graphWidth = Math.max(320, graphElement.clientWidth);
const graphHeight = Math.max(320, graphElement.clientHeight);

const svg = d3.select('#graph')
  .attr('width', graphWidth)
  .attr('height', graphHeight)
  .append('g')
  .attr('transform', 'translate(' + graphWidth / 2 + ',50)');

const data = {
  name: 'Research Interests',
  description: 'Overview of my research interests.',
  children: [
    {
      name: 'AI',
      description: 'Artificial Intelligence research including ML and DL.',
      children: [
        {
          name: 'Machine Learning',
          description: 'Supervised & Unsupervised learning.',
          children: []
        },
        { name: 'Deep Learning', description: 'Neural networks and architectures.' }
      ]
    },
    {
      name: 'Data Science',
      description: 'Working with data, analytics, and visualization.',
      children: [
        { name: 'Visualization', description: 'Graphs and dashboards.' },
        { name: 'Statistics', description: 'Statistical modeling.' }
      ]
    },
    {
      name: 'Networks',
      description: 'Distributed systems and communication networks.',
      children: [
        { name: 'Security', description: 'Cybersecurity and encryption.' },
        { name: 'Protocols', description: 'Network communication models.' }
      ]
    }
  ]
};

const root = d3.hierarchy(data);
const treeLayout = d3.tree().size([graphWidth - 100, graphHeight - 150]);

treeLayout(root);

svg.selectAll('.link')
  .data(root.links())
  .enter()
  .append('path')
  .attr('class', 'link')
  .attr('d', d3.linkVertical()
    .x((d) => d.x - graphWidth / 2 + 50)
    .y((d) => d.y)
  );

svg.selectAll('.node')
  .data(root.descendants())
  .enter()
  .append('circle')
  .attr('class', 'node')
  .attr('cx', (d) => d.x - graphWidth / 2 + 50)
  .attr('cy', (d) => d.y)
  .attr('r', 12)
  .attr('fill', '#22c55e')
  .on('click', (event, d) => showInfo(d.data, event.target));

svg.selectAll('.label')
  .data(root.descendants())
  .enter()
  .append('text')
  .attr('x', (d) => d.x - graphWidth / 2 + 50)
  .attr('y', (d) => d.y + 25)
  .attr('text-anchor', 'middle')
  .text((d) => d.data.name);

function showInfo(data, element) {
  const panel = document.getElementById('infoPanel');

  panel.classList.remove('show');

  setTimeout(() => {
    panel.innerHTML =
      '<h2>' + data.name + '</h2>' +
      '<p>' + (data.description || 'No description available.') + '</p>';
    panel.classList.add('show');
  }, 200);

  d3.selectAll('.node').attr('fill', '#22c55e');
  d3.select(element)
    .transition()
    .duration(200)
    .attr('r', 16)
    .attr('fill', '#38bdf8')
    .transition()
    .duration(200)
    .attr('r', 12);
}

window.addEventListener('resize', function () {
  location.reload();
});
</script>

</body>
</html>
