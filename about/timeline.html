<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline — Career &amp; Education</title>
  <link rel="stylesheet" href="../assets/css/main.css" />

  <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
  <style>
    :root {
      --muted:      #9aa7bf;
      --accent-edu: #6ee7b7;
      --accent-car: #7cc3ff;
      --card-bg:    rgba(11,18,32,0.97);
      --shadow:     0 8px 32px rgba(2,6,23,0.75);
      --ease:       cubic-bezier(.2,.9,.3,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: linear-gradient(180deg, #071028 0%, #0b1220 100%);
      color: #e6eef8;
      font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      line-height: 1.45;
    }

    .timeline-page { margin-top: 4.25rem; }

    /* ── Page header ───────────────────────────── */
    .tl-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 28px 10px;
    }
    .tl-header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .tl-header p  { margin-top: 5px; color: var(--muted); font-size: 14px; }

    /* ── Filter controls ───────────────────────── */
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .legend   { display: flex; gap: 14px; align-items: center; }
    .legend .item   { display: flex; gap: 7px; align-items: center; font-size: 15px; color: var(--muted); }
    .legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

    .btn {
      padding: 8px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
    }
    .btn:hover { color: #e6eef8; border-color: rgba(255,255,255,0.14); }
    .btn.active {
      background: linear-gradient(90deg, var(--accent-car), var(--accent-edu));
      border-color: transparent;
      color: #041020;
      font-weight: 600;
    }

    /* ── Horizontal scroll wrapper ─────────────── */
    .tl-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 28px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .tl-scroll::-webkit-scrollbar        { height: 5px; }
    .tl-scroll::-webkit-scrollbar-track  { background: rgba(255,255,255,0.02); border-radius: 99px; }
    .tl-scroll::-webkit-scrollbar-thumb  { background: rgba(255,255,255,0.1);  border-radius: 99px; }

    /* ── Track (width & height set by JS) ──────── */
    .tl-track { position: relative; }

    /* ── Center rule line ──────────────────────── */
    .tl-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.1) 4%,
        rgba(255,255,255,0.1) 96%,
        transparent
      );
    }

    /* ── Year tick marks ───────────────────────── */
    .tl-tick {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-50%);
      cursor: pointer;
      user-select: none;
    }
    .tl-tick-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.22);
      flex-shrink: 0;
      transition: background .18s;
    }
    .tl-tick:hover .tl-tick-dot { background: rgba(255,255,255,0.32); }
    .tl-tick-label {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    /* ── Event dots on center line ─────────────── */
    .tl-dot {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(8,12,20,0.9);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* ── Connector lines ───────────────────────── */
    .tl-conn {
      position: absolute;
      width: 1.5px;
      border-radius: 2px;
    }

    /* ── Event cards ───────────────────────────── */
    .tl-card {
      position: absolute;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: var(--shadow);
      opacity: 0;
      transition:
        opacity   .38s var(--ease),
        transform .38s var(--ease),
        box-shadow .22s var(--ease),
        border-color .22s;
    }
    /* initial (pre-reveal) transform — card width & centering set inline by JS */
    .tl-card.above { transform: translateX(-50%) translateY(10px); }
    .tl-card.below { transform: translateX(-50%) translateY(-10px); }
    /* revealed */
    .tl-card.visible            { opacity: 1; }
    .tl-card.visible.above      { transform: translateX(-50%); }
    .tl-card.visible.below      { transform: translateX(-50%); }
    /* hover — float away from center line */
    .tl-card.visible.above:hover {
      transform: translateX(-50%) translateY(-6px);
      box-shadow: 0 22px 52px rgba(2,6,23,0.9);
      border-color: rgba(255,255,255,0.11);
    }
    .tl-card.visible.below:hover {
      transform: translateX(-50%) translateY(6px);
      box-shadow: 0 22px 52px rgba(2,6,23,0.9);
      border-color: rgba(255,255,255,0.11);
    }

    .card-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      color: #031220;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; line-height: 1.35; }
    .card-sub   { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
    .card-desc  { font-size: 13.5px; color: #c4dff7; opacity: 0.88; line-height: 1.58; }

    @media (max-width: 980px) { .timeline-page { margin-top: 3.25rem; } }
    @media (max-width: 680px) {
      .tl-header { padding: 14px 16px 8px; }
      .tl-scroll  { padding: 0 14px 16px; }
    }
  </style>
</head>

    <div class="timeline-page">

      <header class="tl-header">
        <div>
          <h1>Career &amp; Education Timeline</h1>
          <p>Scroll horizontally &middot; filter by type</p>
        </div>
        <div class="controls">
          <div class="legend">
            <div class="item">
              <span class="swatch" style="background:var(--accent-edu)"></span>Education
            </div>
            <div class="item">
              <span class="swatch" style="background:var(--accent-car)"></span>Career
            </div>
          </div>
          <button class="btn active" id="btn-all">All</button>
          <button class="btn"        id="btn-career">Career</button>
          <button class="btn"        id="btn-edu">Education</button>
        </div>
      </header>

      <div class="tl-scroll" id="tl-scroll">
        <div class="tl-track" id="tl-track"></div>
      </div>

    </div>
  </div>

  <script src="../assets/js/jquery.min.js"></script>
  <script src="../assets/js/jquery.scrollex.min.js"></script>
  <script src="../assets/js/browser.min.js"></script>
  <script src="../assets/js/breakpoints.min.js"></script>
  <script src="../assets/js/util.js"></script>
  <script src="../assets/js/main.js"></script>

  <script>
  (() => {
    /* ── Event data ────────────────────────────────────────── */
    const ALL_EVENTS = [
      {
        year: 2020, type: 'education', place: 'down',
        title:   'Lyceum Diploma',
        sub: 'High School Graduation | 2020',
        // title: 'High School Graduation',
        // sub:   'Lyceum Diploma',
        desc:  'Grade 19.33 / 20 (Excellent). <br> Focus: Maths, Physics and CS.'
        // desc:  'Grade 19.33 / 20 (Excellent). <br> Focus: Maths, Physics and Computer Science.'
      },
      {
        year: 2021, type: 'education', place: 'up',
        // title: 'Started University',
        title: 'Started Undergrad',
        sub:   'UCY ECE | 2021',
        desc:  'Admitted to ECE department at the University of Cyprus. Achieved 1st place in the Pancyprian Entrance Examination.'
        // desc:  'Admitted to Electrical & Computer Engineering Department at the University of Cyprus. Achieved 1st place in the Pancyprian Entrance Examinations.'
      },
      {
        year: 2023, type: 'career', place: 'down',
        title: 'QA Automation Engineer Intern',
        sub:   'HF Markets | Summer 2023',
        desc:  'Built automated tests, designed Ci/CD pipepelines and API testing.'
      },
      {
        year: 2024, type: 'career', place: 'up',
        title: 'Summer Research (Internship)',
        sub:   'Texas A&M University | Summer 2024',
        desc:  'Participated in summer research internship at Texas A&M University. Research Area: Cloud Computing. '
      },
      {
        year: 2025, type: 'education', place: 'down',
        title: 'Completed Bachelor Degree',
        sub:   'BSc Computer Engineering | May 2025',
        desc:  'Graduated from the University of Cyprus with a BSc in Computer Engineering. Best academic performance & Thesis award.'
      },
      {
        year: 2025, type: 'career', place: 'up',
        title: 'Research Engineer',
        sub:   'KIOS CoE | July 2025 – Present',
        desc:  'Research Area: Testability Analysis and Machine Learning.'
      },
      {
        year: 2025, type: 'career', place: 'down',
        title: 'Teaching Assistant',
        sub:   'UCY ECE | September – December 2025',
        desc:  'Course: CAD for VLSI.'
      },
      // {
      //   year: 2026, type: 'education', place: 'up',
      //   title: 'Starting MSc',
      //   sub:   'September 2026',
      //   desc:  'Beginning a Master of Science degree — continuing academic growth after professional experience.'
      // },
    ];

    /* ── Layout constants ──────────────────────────────────── */
    const MIN_Y     = 2020;
    const MAX_Y     = 2026;
    const COL       = 450;    // px per year column (wider to accommodate same-year spreads)
    const PAD_X     = 80;     // horizontal padding each side

    // Vertical geometry — all y values are from track top
    const TOP_PAD   = 22;     // breathing room above above-cards
    const CARD_AREA = 225;    // vertical space reserved per card section (≥ max card height)
    const CONN_H    = 34;     // connector length (card edge → dot edge)
    const DOT_R     = 7;      // event dot radius (px)
    const TICK_R    = 4;      // year-tick dot radius (CSS: 8px diameter)

    // The center line y-coordinate — everything aligns to this
    const CENTER_Y  = TOP_PAD + CARD_AREA + CONN_H + DOT_R; // 22+225+34+7 = 288
    const ABOVE_BTM = CENTER_Y - DOT_R - CONN_H;            // 288-7-34 = 247
    const BELOW_TOP = CENTER_Y + DOT_R + CONN_H;            // 288+7+34 = 329
    const TRACK_H   = BELOW_TOP + CARD_AREA + TOP_PAD;      // 329+225+22 = 576
    const TRACK_W   = (MAX_Y - MIN_Y + 1) * COL + PAD_X * 2; // 7*450+160 = 3310

    // Card width and horizontal spread step for same-side same-year events
    const CARD_W    = 260;    // wider cards = less vertical stretch
    const STEP      = CARD_W + 20; // 280px between card centers

    /* ── DOM ───────────────────────────────────────────────── */
    const track  = document.getElementById('tl-track');
    const scroll = document.getElementById('tl-scroll');

    track.style.width  = TRACK_W + 'px';
    track.style.height = TRACK_H + 'px';

    /* ── Helpers ───────────────────────────────────────────── */
    function yearToX(year) {
      return PAD_X + (year - MIN_Y) * COL + COL / 2;
    }

    function hexCol(type) {
      return type === 'education' ? '#6ee7b7' : '#7cc3ff';
    }

    function grad(type) {
      return type === 'education'
        ? 'linear-gradient(135deg, #6ee7b7, #34d399)'
        : 'linear-gradient(135deg, #7cc3ff, #60a5fa)';
    }

    function make(tag, cls, styles) {
      const el = document.createElement(tag);
      if (cls)    el.className = cls;
      if (styles) Object.assign(el.style, styles);
      track.appendChild(el);
      return el;
    }

    /* ── Center line ───────────────────────────────────────── */
    // Offset by -1 so the 2px line is visually centered on CENTER_Y
    make('div', 'tl-line', { top: (CENTER_Y - 1) + 'px' });

    /* ── Year ticks ────────────────────────────────────────── */
    // top = CENTER_Y - TICK_R so the 8px dot (radius 4) is centered on CENTER_Y
    for (let y = MIN_Y; y <= MAX_Y; y++) {
      const x = yearToX(y);
      const tick = make('div', 'tl-tick', {
        left: x + 'px',
        top:  (CENTER_Y - TICK_R) + 'px',
      });
      tick.innerHTML =
        `<div class="tl-tick-dot"></div><div class="tl-tick-label">${y}</div>`;
      tick.addEventListener('click', () => jumpToYear(y));
    }

    /* ── Render events ─────────────────────────────────────── */
    function render(filter) {
      track.querySelectorAll('.tl-card, .tl-conn, .tl-dot').forEach(el => el.remove());

      const evs = ALL_EVENTS.filter(ev => !filter || ev.type === filter);

      // Placement: use explicit place:'up'/'down' if set, else alternate starting from down.
      evs.forEach((ev, idx) => {
        if (ev.place === 'up')        ev._isAbove = true;
        else if (ev.place === 'down') ev._isAbove = false;
        else                          ev._isAbove = idx % 2 === 1;
      });

      // For same-year same-side events, spread horizontally so they don't overlap.
      const yearSide = {};
      evs.forEach(ev => {
        const key = ev.year + ':' + (ev._isAbove ? 'A' : 'B');
        if (!yearSide[key]) yearSide[key] = [];
        yearSide[key].push(ev);
      });
      Object.values(yearSide).forEach(group => {
        group.forEach((ev, i) => {
          ev._xOff = (i - (group.length - 1) / 2) * STEP;
        });
      });

      evs.forEach((ev, idx) => {
        const x    = yearToX(ev.year) + (ev._xOff || 0);
        const col  = hexCol(ev.type);
        const g    = grad(ev.type);

        // Event dot — centered on center line (top = CENTER_Y - DOT_R)
        make('div', 'tl-dot', {
          left:       (x - DOT_R) + 'px',
          top:        (CENTER_Y - DOT_R) + 'px',
          width:      (DOT_R * 2) + 'px',
          height:     (DOT_R * 2) + 'px',
          background: g,
        });

        // Connector — fades from dot outward toward card
        if (ev._isAbove) {
          make('div', 'tl-conn', {
            left:       (x - 0.75) + 'px',
            top:        ABOVE_BTM + 'px',
            height:     CONN_H + 'px',
            background: `linear-gradient(to top, ${col}, transparent)`,
          });
        } else {
          make('div', 'tl-conn', {
            left:       (x - 0.75) + 'px',
            top:        (CENTER_Y + DOT_R) + 'px',
            height:     CONN_H + 'px',
            background: `linear-gradient(to bottom, ${col}, transparent)`,
          });
        }

        // Card — no maxHeight so full content is always visible
        const card = make('div', `tl-card ${ev._isAbove ? 'above' : 'below'}`, {
          left:  x + 'px',
          width: CARD_W + 'px',
          // above: anchor bottom at ABOVE_BTM, grows upward (needs CARD_AREA headroom)
          // below: anchor top at BELOW_TOP, grows downward
          ...(ev._isAbove
            ? { bottom: (TRACK_H - ABOVE_BTM) + 'px' }
            : { top:    BELOW_TOP + 'px' }),
        });

        card.innerHTML = `
          <div class="card-badge" style="background:${g}">
            ${ev.type === 'education' ? 'Education' : 'Career'}
          </div>
          <div class="card-title">${ev.title}</div>
          <div class="card-sub">${ev.sub}</div>
          <p class="card-desc">${ev.desc}</p>
        `;

        setTimeout(() => card.classList.add('visible'), 65 * idx);
      });
    }

    function jumpToYear(y) {
      const x = yearToX(y) - scroll.clientWidth / 2;
      scroll.scrollTo({ left: Math.max(0, x), behavior: 'smooth' });
    }

    /* ── Filter buttons ────────────────────────────────────── */
    const btnAll    = document.getElementById('btn-all');
    const btnCareer = document.getElementById('btn-career');
    const btnEdu    = document.getElementById('btn-edu');

    function setActive(btn) {
      [btnAll, btnCareer, btnEdu].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    btnAll.addEventListener('click',    () => { setActive(btnAll);    render(null); });
    btnCareer.addEventListener('click', () => { setActive(btnCareer); render('career'); });
    btnEdu.addEventListener('click',    () => { setActive(btnEdu);    render('education'); });

    /* ── Mousewheel → smooth horizontal scroll ────────────── */
    let wVel = 0;
    let wRaf = null;
    function wStep() {
      scroll.scrollLeft += wVel;
      wVel *= 0.86;
      const atBound = scroll.scrollLeft <= 0 ||
                      scroll.scrollLeft >= scroll.scrollWidth - scroll.clientWidth - 1;
      if (Math.abs(wVel) < 0.3 || atBound) { wVel = 0; wRaf = null; return; }
      wRaf = requestAnimationFrame(wStep);
    }
    scroll.addEventListener('wheel', e => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        wVel += e.deltaY * 0.25;
        if (!wRaf) wRaf = requestAnimationFrame(wStep);
      }
    }, { passive: false });

    render(null);
  })();
  </script>
</body>
